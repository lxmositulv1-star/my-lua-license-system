<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Lua License - Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Admin Dashboard</h1>
                <p class="text-xs text-slate-400 mt-1">Manage your Lua script license keys securely</p>
            </div>
            <div id="auth-section" class="w-full sm:w-auto">
                <button id="logout-btn" onclick="logoutAdmin()" class="hidden bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition">Logout</button>
            </div>
        </header>

        <!-- Login Card -->
        <div id="login-card" class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl max-w-md mx-auto">
            <h2 class="text-xl font-bold mb-4 text-cyan-400">Admin Setup & Login</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Supabase Project URL</label>
                    <input type="text" id="supabase-url" placeholder="https://xyz.supabase.co" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Supabase Anon Key</label>
                    <input type="password" id="supabase-key" placeholder="eyJhbGciOi..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Admin Secret Password</label>
                    <input type="password" id="admin-pass" placeholder="Set your admin password" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500">
                </div>
                <button onclick="loginAdmin()" class="w-full bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-black py-3 rounded-xl transition shadow-lg shadow-cyan-500/20">Connect & Login</button>
            </div>
        </div>

        <!-- Main Dashboard -->
        <div id="dashboard-content" class="hidden space-y-6">
            <!-- Stats Grid -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <p class="text-xs text-slate-400">Total Keys</p>
                    <p id="stat-total" class="text-2xl font-black text-cyan-400 mt-1">0</p>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <p class="text-xs text-slate-400">Active</p>
                    <p id="stat-active" class="text-2xl font-black text-emerald-400 mt-1">0</p>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <p class="text-xs text-slate-400">Expired</p>
                    <p id="stat-expired" class="text-2xl font-black text-amber-400 mt-1">0</p>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <p class="text-xs text-slate-400">Banned</p>
                    <p id="stat-banned" class="text-2xl font-black text-red-400 mt-1">0</p>
                </div>
            </div>

            <!-- Generate Key Generator Card -->
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
                <h2 class="text-lg font-bold mb-4 text-cyan-400">Generate New License Key</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Duration (Days)</label>
                        <select id="key-duration" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500">
                            <option value="7">7 Days</option>
                            <option value="30">30 Days</option>
                            <option value="90">90 Days (Custom)</option>
                            <option value="365">365 Days (Lifetime/1 Year)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Custom Prefix / Note</label>
                        <input type="text" id="key-prefix" placeholder="e.g.VIP" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500">
                    </div>
                    <button onclick="generateKey()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black py-3 rounded-xl transition shadow-lg shadow-emerald-500/20">Generate Key</button>
                </div>
                <div id="generated-key-display" class="hidden mt-4 p-4 bg-slate-950 border border-emerald-500/30 rounded-xl flex justify-between items-center">
                    <div>
                        <p class="text-xs text-emerald-400 font-bold">New Key Generated (Save it now!):</p>
                        <p id="raw-key-text" class="font-mono text-lg text-white font-bold select-all mt-1"></p>
                    </div>
                    <button onclick="copyKey()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-xs font-bold">Copy</button>
                </div>
            </div>

            <!-- License List Table -->
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl overflow-hidden">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-cyan-400">All Generated Keys</h2>
                    <button onclick="loadKeys()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl text-xs font-bold">Refresh</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-950 text-slate-400 border-b border-slate-800">
                            <tr>
                                <th class="p-3">Key (Hash Snippet)</th>
                                <th class="p-3">Duration</th>
                                <th class="p-3">Status</th>
                                <th class="p-3">Device ID</th>
                                <th class="p-3">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="keys-table-body" class="divide-y divide-slate-800">
                            <tr><td colspan="5" class="p-4 text-center text-slate-500">Loading keys...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let supabaseClient = null;

        function getCredentials() {
            return {
                url: localStorage.getItem('sb_url'),
                key: localStorage.getItem('sb_key'),
                pass: localStorage.getItem('sb_pass')
            };
        }

        window.onload = function() {
            const creds = getCredentials();
            if (creds.url && creds.key && creds.pass) {
                document.getElementById('supabase-url').value = creds.url;
                document.getElementById('supabase-key').value = creds.key;
                document.getElementById('admin-pass').value = creds.pass;
                loginAdmin(true);
            }
        };

        function loginAdmin(auto = false) {
            const url = document.getElementById('supabase-url').value.trim();
            const key = document.getElementById('supabase-key').value.trim();
            const pass = document.getElementById('admin-pass').value.trim();

            if (!url || !key || !pass) {
                if (!auto) alert('Please fill all fields.');
                return;
            }

            try {
                supabaseClient = supabase.createClient(url, key);
                localStorage.setItem('sb_url', url);
                localStorage.setItem('sb_key', key);
                localStorage.setItem('sb_pass', pass);

                document.getElementById('login-card').classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('hidden');
                document.getElementById('logout-btn').classList.remove('hidden');
                loadKeys();
            } catch (e) {
                alert('Connection failed: ' + e.message);
            }
        }

        function logoutAdmin() {
            localStorage.clear();
            location.reload();
        }

        async function generateKey() {
            const duration = parseInt(document.getElementById('key-duration').value);
            const prefix = document.getElementById('key-prefix').value.trim();
            
            // Generate random secure key
            const randomBytes = crypto.getRandomValues(new Uint8Array(16));
            const randomHex = Array.from(randomBytes).map(b => b.toString(16).padStart(2, '0')).join('');
            const rawKey = prefix ? `${prefix}-${randomHex}` : `LUA-${randomHex}`;
            
            // Hash key using SHA-256
            const keyHash = CryptoJS.SHA256(rawKey).toString();

            const { error } = await supabaseClient
                .from('license_keys')
                .insert([{ key_hash: keyHash, duration_days: duration, status: 'active' }]);

            if (error) {
                alert('Error generating key: ' + error.message);
            } else {
                document.getElementById('raw-key-text').innerText = rawKey;
                document.getElementById('generated-key-display').classList.remove('hidden');
                loadKeys();
            }
        }

        function copyKey() {
            const text = document.getElementById('raw-key-text').innerText;
            navigator.clipboard.writeText(text);
            alert('License key copied to clipboard!');
        }

        async function loadKeys() {
            const { data, error } = await supabaseClient
                .from('license_keys')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                return;
            }

            let total = data.length;
            let active = 0, expired = 0, banned = 0;
            let tbody = '';

            data.forEach(k => {
                if (k.status === 'active') active++;
                if (k.status === 'expired') expired++;
                if (k.status === 'banned') banned++;

                tbody += `
                    <tr class="hover:bg-slate-950/50">
                        <td class="p-3 font-mono text-xs text-cyan-400">${k.key_hash.substring(0, 10)}...</td>
                        <td class="p-3">${k.duration_days} Days</td>
                        <td class="p-3"><span class="px-2 py-1 rounded-full text-xs font-bold ${k.status === 'active' ? 'bg-emerald-500/10 text-emerald-400' : k.status === 'banned' ? 'bg-red-500/10 text-red-400' : 'bg-amber-500/10 text-amber-400'}">${k.status}</span></td>
                        <td class="p-3 font-mono text-xs text-slate-400">${k.device_id || 'Not Bound'}</td>
                        <td class="p-3 space-x-2">
                            ${k.status === 'active' ? `<button onclick="updateStatus('${k.id}', 'banned')" class="text-red-400 hover:underline text-xs font-bold">Ban</button>` : `<button onclick="updateStatus('${k.id}', 'active')" class="text-emerald-400 hover:underline text-xs font-bold">Unban</button>`}
                            <button onclick="deleteKey('${k.id}')" class="text-slate-500 hover:text-red-400 text-xs font-bold">Delete</button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-active').innerText = active;
            document.getElementById('stat-expired').innerText = expired;
            document.getElementById('stat-banned').innerText = banned;
            document.getElementById('keys-table-body').classList.remove('animate-pulse');
            document.getElementById('keys-table-body').innerHTML = tbody || '<tr><td colspan="5" class="p-4 text-center text-slate-500">No license keys generated yet.</td></tr>';
        }

        async function updateStatus(id, newStatus) {
            const { error } = await supabaseClient
                .from('license_keys')
                .update({ status: newStatus })
                .eq('id', id);

            if (error) alert('Failed: ' + error.message);
            else loadKeys();
        }

        async function deleteKey(id) {
            if (!confirm('Are you sure you want to delete this key?')) return;
            const { error } = await supabaseClient
                .from('license_keys')
                .delete()
                .eq('id', id);

            if (error) alert('Failed: ' + error.message);
            else loadKeys();
        }
    </script>
</body>
</html>
