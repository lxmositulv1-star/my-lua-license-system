<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAJ MODS - Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 15px; margin: 0; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { background: #06b6d4; font-weight: bold; border: none; cursor: pointer; }
        button:active { background: #0891b2; }
        table { width: 100%; font-size: 14px; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #334155; word-break: break-all; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div style="text-align: center; margin-bottom: 20px;">
        <h2>RAJ MODS Admin</h2>
    </div>

    <!-- Login Screen -->
    <div id="loginSection" class="card">
        <h3>Enter Admin Password</h3>
        <input type="password" id="adminPassInput" placeholder="Enter Password (783126)">
        <button onclick="handleLogin()">Login</button>
        <p id="loginError" style="color: #ef4444; font-size: 14px; text-align: center;"></p>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboardSection" class="card hidden">
        <h3>Generate License Key</h3>
        <label>Select Duration:</label>
        <select id="keyDuration">
            <option value="1">1 Day</option>
            <option value="7" selected>7 Days</option>
            <option value="15">15 Days</option>
            <option value="30">30 Days</option>
        </select>
        <button onclick="generateKey()">Generate Key</button>
        
        <div id="generatedKeyBox" class="hidden" style="margin-top: 15px; background: #0f172a; padding: 10px; border-radius: 6px; text-align: center;">
            <p style="font-size: 12px; color: #94a3b8; margin: 0 0 5px 0;">Generated Key (Copy this):</p>
            <input type="text" id="newKeyOutput" readonly style="text-align: center; font-weight: bold; color: #22c55e; margin: 0;">
            <button onclick="copyKey()" style="background: #22c55e; margin-top: 8px;">Copy Key</button>
        </div>

        <h3 style="margin-top: 25px;">Active & Generated Keys</h3>
        <button onclick="loadKeys()" style="background: #334155; padding: 8px; font-size: 14px;">Refresh List</button>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Key</th>
                        <th>Duration</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="keysTableBody">
                    <tr><td colspan="3" style="text-align: center;">Click refresh to load...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ywthnvvvplxixqpwo.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_a9LKycb_-I2utPcyx8t0IA_NNQTetbV";
        const CORRECT_PASSWORD = "783126";

        let supabaseClient = null;

        function handleLogin() {
            const enteredPass = document.getElementById('adminPassInput').value.trim();
            if (enteredPass === CORRECT_PASSWORD) {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                loadKeys();
            } else {
                document.getElementById('loginError').innerText = "Incorrect Password! Try again.";
            }
        }

        async function generateKey() {
            if (!supabaseClient) return;
            const days = parseInt(document.getElementById('keyDuration').value);
            
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let randomPart = "";
            for (let i = 0; i < 12; i++) {
                randomPart += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            const rawKey = "RAJ-" + randomPart.match(/.{1,4}/g).join("-");

            const expiresAt = new Date();
            expiresAt.setDate(expiresAt.getDate() + days);

            const { error } = await supabaseClient
                .from('license_keys')
                .insert([{ key_hash: rawKey, duration_days: days, status: 'active', expires_at: expiresAt.toISOString() }]);

            if (error) {
                alert("Error generating key: " + error.message);
            } else {
                document.getElementById('newKeyOutput').value = rawKey;
                document.getElementById('generatedKeyBox').classList.remove('hidden');
                loadKeys();
            }
        }

        function copyKey() {
            const copyText = document.getElementById('newKeyOutput');
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("Key Copied Successfully: " + copyText.value);
        }

        async function loadKeys() {
            if (!supabaseClient) return;
            const { data, error } = await supabaseClient.from('license_keys').select('*').order('created_at', { ascending: false });
            
            const tbody = document.getElementById('keysTableBody');
            tbody.innerHTML = "";

            if (error || !data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center;">No keys found.</td></tr>`;
                return;
            }

            data.forEach(item => {
                let row = `<tr>
                    <td>${item.key_hash}</td>
                    <td>${item.duration_days} Days</td>
                    <td style="color: ${item.status === 'active' ? '#22c55e' : '#ef4444'}">${item.status}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }
    </script>
</body>
</html>
